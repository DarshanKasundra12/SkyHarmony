  <rect x="328" y="140" width="24" height="260" rx="4" fill="#D4AF37"/>
  
  <!-- Connecting Horizontal Bar -->
  <rect x="160" y="260" width="192" height="12" rx="2" fill="#D4AF37"/>
  
  <!-- Architectural Sky Arch -->
  <path d="M160 140C160 140 200 100 256 100C312 100 352 140 352 140" stroke="#D4AF37" stroke-width="20" stroke-linecap="round"/>
  
